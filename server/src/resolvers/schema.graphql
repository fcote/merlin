  deletedAt: DateTime
  frequency: UserTransactionFrequency!
  id: ID!
  name: String
  type: UserTransactionType!
  userId: String!
  value: Float
}

enum UserTransactionCategory {
  extra
  groceries
  rent
  subscription
}

input UserTransactionFields {
  category: UserTransactionCategory
  date: String
  deletedAt: DateTime
  frequency: UserTransactionFrequency
  id: ID
  name: String
  type: UserTransactionType
  value: Float
}

input UserTransactionFilters {
  categories: [UserTransactionCategory!]
  frequencies: [UserTransactionFrequency!]
  since: String
  types: [UserTransactionType!]
}

enum UserTransactionFrequency {
  daily
  monthly
  punctual
